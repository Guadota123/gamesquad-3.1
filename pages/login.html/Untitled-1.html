<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMESQUAD - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <h1 class="logo">GAMESQUAD</h1>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="squads.html">Squads</a></li>
                <li><a href="login.html">Ingresar</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm" class="card-form">
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required placeholder="usuario@ejemplo.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary">Ingresar</button>
            <p id="errorMsg" class="error-text"></p>
        </form>
    </main>

    <script src="../js/main.js"></script>
</body>
</html>
